<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINGO - Live Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="card">
        <h1>WINGO</h1>
        <p>Format: <code>firstname.lastname.ddmm</code></p>
        <input type="text" id="username-input" placeholder="siddharth.choudhary.3105">
        <div class="btn-group">
            <button class="btn primary" onclick="join('player')">Join as Player</button>
            <button class="btn secondary" onclick="join('admin')">Join as Admin</button>
        </div>
    </div>

    <!-- Main Game Container -->
    <div id="game-container" style="display: none;">
        <!-- Admin Panel -->
        <div id="admin-panel" class="card" style="display: none;">
            <h2>Admin Control Panel</h2>
            <div class="btn-group">
                <button class="btn primary" onclick="adminDraw()">Draw Next Number</button>
                <button class="btn warning" onclick="toggleAutoDraw()">Toggle Auto-Timer (10s)</button>
                <button class="btn danger" onclick="resetGame()">Reset Game</button>
            </div>
        </div>

        <div class="main-layout">
            <!-- Game Board -->
            <div class="game-board card">
                <!-- Slot Machine & Timer -->
                <div class="slot-machine">
                    <div class="slot-display">
                        <span id="draw-symbol">---</span>
                        <span id="draw-number">--</span>
                    </div>
                    <div class="timer-box">
                        Timer: <span id="timer-display">10</span>s | Drawn: <span id="drawn-count">0</span>/90
                    </div>
                </div>

                <!-- Ticket Grid -->
                <div id="grid-header" class="grid-row header-row">
                    <div></div> <!-- Label Column -->
                    <div>🔔 Bell</div>
                    <div>🍒 Cherry</div>
                    <div>🎰 Bar</div>
                    <div>🐴 Horseshoe</div>
                    <div>🍀 Clover</div>
                    <div></div> <!-- Block Badge Column -->
                </div>

                <div id="ticket-grid"></div>
            </div>

            <!-- Leaderboard & Player Stats -->
            <div class="side-panel">
                <div class="card score-card">
                    <h3>Your Score</h3>
                    <div id="player-score" class="score-display">0</div>
                    <div id="score-breakdown" class="breakdown"></div>
                </div>

                <div class="card leaderboard-card">
                    <h3>Live Leaderboard</h3>
                    <ol id="leaderboard-list"></ol>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
